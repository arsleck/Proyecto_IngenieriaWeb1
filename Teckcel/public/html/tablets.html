<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablets y iPads | TeckCel</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/modales.css">
    <link rel="stylesheet" href="../css/productoModal.css">
    <link rel="stylesheet" href="../css/categoria.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" href="../img/assets/icon.png" type="image/x-icon">
</head>
<body style="background-color: #f9fafb;">

    <nav class="top-nav light-nav">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <img src="../img/assets/icon.png" alt="Logo TeckCel" class="brand-logo-img">
                TeckCel
            </a>
            
            <div class="nav-links">
                <a href="celulares.html" class="nav-item">
                    <img src="https://img.icons8.com/ios-filled/50/333333/smartphone.png" alt="Celulares" class="nav-icon-img">
                    <span>Móviles</span>
                </a>
                <a href="tablets.html" class="nav-item active">
                    <img src="https://img.icons8.com/ios-filled/50/333333/ipad.png" alt="Tablets" class="nav-icon-img">
                    <span>Tablets</span>
                </a>
                <a href="laptops.html" class="nav-item">
                    <img src="https://img.icons8.com/ios-filled/50/333333/laptop.png" alt="Portátiles" class="nav-icon-img">
                    <span>Laptops</span>
                </a>
            </div>

            <div class="search-bar" onclick="abrirBuscador()" style="cursor: pointer;">
                <img src="https://img.icons8.com/ios-filled/50/666666/search--v1.png" alt="Buscar" class="search-icon-img">
                <input type="text" placeholder="Busca móviles, tablets..." readonly style="cursor: pointer;">
            </div>

            <div class="nav-actions">
                <button class="icon-btn" onclick="abrirNotificaciones()" title="Notificaciones">
                    <img src="https://img.icons8.com/ios-filled/50/333333/bell.png" alt="Notificaciones" class="action-icon">
                    <span class="badge" id="notif-count" style="background-color: #ff0076; display: none;">0</span>
                </button>
                
                <button class="icon-btn" onclick="verMisListas()" title="Mis Listas">
                    <img src="https://img.icons8.com/ios-filled/50/333333/like--v1.png" alt="Listas" class="action-icon">
                    <span class="badge" id="fav-count" style="background-color: #9c27b0;">0</span>
                </button>

                <button class="icon-btn" onclick="abrirCarrito()" title="Carrito">
                    <img src="https://img.icons8.com/ios-filled/50/333333/shopping-cart.png" alt="Carrito" class="action-icon">
                    <span class="badge" id="cart-count">0</span>
                </button>
                
                <button class="user-btn" onclick="abrirModalCuenta()" title="Mi Cuenta">
                    <div class="avatar">U</div>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero-budget creative-hero">
        <div class="hero-container">
            <h1>Descubre tu próxima <span class="highlight">Tablet</span></h1>
            <p>Comparamos pantallas, procesadores y precios para que disfrutes de la mejor experiencia portátil.</p>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 40px auto; padding: 0 20px; min-height: 60vh;">
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
            <h2 style="font-size: 1.6rem; color: #111827; margin: 0;">Catálogo de Tablets</h2>
        </div>

        <div class="k-grid" id="grid-productos-categoria"></div>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal light-modal" id="modal-contenido"></div>
    </div>
    
    <div id="modal-buscador" class="modal-overlay hidden">
        <div class="modal search-modal">
            <div class="search-modal-header">
                <h2>Búsqueda</h2>
                <button onclick="cerrarBuscador()" class="close-btn">&times;</button>
            </div>
            <div class="search-modal-input-container">
                <span class="search-icon" style="color: #999;">🔍</span>
                <input type="text" id="input-buscador-modal" placeholder="Ej: iPad Pro, Galaxy Tab..." onkeyup="ejecutarBusquedaModal(this.value)">
                <button onclick="document.getElementById('input-buscador-modal').value=''; ejecutarBusquedaModal('');" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc;">&times;</button>
            </div>
            <div class="search-modal-results" id="resultados-busqueda"></div>
        </div>
    </div>

    <script>
        const CATEGORIA_ACTUAL = 'Tablets';
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/index/auth.js"></script>
    <script src="../js/index/buscador.js"></script>
    <script src="../js/index/carrito.js"></script>
    <script src="../js/index/favoritos.js"></script>
    <script src="../js/index/productoModal.js"></script>
    <script src="../js/index/ui.js"></script>
    <script src="../js/index/notificaciones.js"></script>
    <script src="../js/index/modalUtils.js"></script>
    <script src="../js/index/modalBuilder.js"></script>
    <script src="../js/index/valoraciones.js"></script>
    <script src="../js/index/categoria.js"></script>

</body>
</html>
